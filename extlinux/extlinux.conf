# Boot configuration read by lk2nd from the active boot subpartition.
#
# lk2nd's extlinux parser understands label, default, kernel/linux, initrd,
# fdt/devicetree, fdtdir and fdtoverlays. It does NOT understand `timeout` or
# `menu`, and it always boots the `default` label — there is no interactive
# menu, so anything that needs choosing has to be decided elsewhere.
#
# One device tree covers both watches. Mobvoi's downstream tree calls the LTE
# board `rover` (SDM429W) and the GPS board `rubyfish` (SDA429W); they differ
# only in whether the SoC has a modem, and mainline ships a single
# sdm429w-mobvoi-rover.dtb for both. The two are told apart earlier, by the
# stock bootloader picking the matching appended DTB out of lk2nd.img.
#
# Console is the watch's own display. lk2nd leaves the panel lit and the
# device tree carries a simple-framebuffer at 0x90001000 (454x454, r8g8b8),
# which the kernel binds with SimpleDRM; fbcon then puts a text console on
# tty0. There is no practical serial port on this device, so if the kernel
# panics before fbcon is up there is nothing to read — the initramfs brings
# up USB networking and telnetd as the recovery path instead.

default Nerves

label Nerves
	kernel /Image
	fdt /sdm429w-mobvoi-rover.dtb
	initrd /initramfs.gz
	append console=tty0 loglevel=8 fbcon=font:TER16x32 nerves_base=userdata rootfstype=squashfs ro rootwait panic=30
