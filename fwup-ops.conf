# Post-installation firmware operations for the Mobvoi TicWatch Pro 3.
#
# Tasks include:
#
# * `factory-reset` - Clear the writable filesystem so it gets
#                     re-initialised on the next boot.
# * `prevent-revert` - Prevent `revert` from working until the next
#                     firmware install.
# * `revert` - Roll back to the previous firmware slot if still
#               present.
# * `validate` - Mark the running firmware as known-good.
# * `status` - Print which slot is active (`a` or `b`).
#
# On the device, run:
#     fwup -t <task> -d /dev/rootdisk0 --enable-trim /usr/share/fwup/ops.fw

require-fwup-version="1.0.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

mbr mbr-a {
    partition 0 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = 0x83
        boot = true
    }
    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
    partition 2 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83
        expand = true
    }
}

mbr mbr-b {
    partition 0 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = 0x83
        boot = true
    }
    partition 1 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
    partition 2 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83
        expand = true
    }
}

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

task factory-reset {
    on-init {
        info("Invalidating the application data partition so nerves_runtime reformats it on next boot.")
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

task prevent-revert.a {
    require-partition-offset(0, ${BOOT_B_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    on-init {
        info("Preventing reverts to partition A")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
        trim(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
    }
}

task prevent-revert.b {
    require-partition-offset(0, ${BOOT_A_PART_OFFSET})
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")

    on-init {
        info("Preventing reverts to partition B")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
        trim(${BOOT_B_PART_OFFSET}, ${BOOT_B_PART_COUNT})
    }
}

task prevent-revert.fail {
    on-init {
        error("Cannot determine the inactive firmware slot.")
    }
}

task revert.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-partition-offset(1, ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        info("Reverting to partition A")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        mbr_write(mbr-a)
    }
}

task revert.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-partition-offset(1, ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        info("Reverting to partition B")
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        mbr_write(mbr-b)
    }
}

task revert.unexpected {
    on-init {
        error("Nothing to revert to.")
    }
}

task validate.a {
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    on-init {
        info("Validating partition A")
        uboot_setenv(uboot-env, "a.nerves_fw_validated", "1")
    }
}

task validate.b {
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    on-init {
        info("Validating partition B")
        uboot_setenv(uboot-env, "b.nerves_fw_validated", "1")
    }
}

task validate.fail {
    on-init {
        error("Cannot determine the active firmware slot.")
    }
}

task status.aa {
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("a") }
}

task status.ab {
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("a->b") }
}

task status.bb {
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("b") }
}

task status.ba {
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("b->a") }
}

task status.fail {
    on-init {
        error("unknown")
    }
}
