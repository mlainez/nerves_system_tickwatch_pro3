# Firmware metadata and partition layout for the Mobvoi TicWatch Pro 3.
#
# Override any of these via environment variables of the same name.

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "TicWatchPro3")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Spin42")

# The stock Android `userdata` partition. The whole Nerves layout (MBR +
# uboot env + boot A/B + rootfs A/B + app data, see below) is written raw
# into it by `fastboot flash userdata`; lk2nd then finds
# /extlinux/extlinux.conf on the boot subpartition.
#
# `userdata` is not at a fixed eMMC partition number across TicWatch Pro 3
# firmware revisions, and it differs between the GPS and LTE variants, so
# nothing here names /dev/mmcblk0pNN. The initramfs looks the partition up
# by its GPT name (see packages/citronics-initramfs) and publishes these
# stable aliases before anything else touches them.
define(NERVES_FW_DEVPATH, "/dev/nerves-userdata")

# Subpartitions of the above, mapped by kpartx in the initramfs.
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/nerves-app")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")

# Default paths.
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Subpartition layout inside `userdata` (units = 512 B blocks):
#
#   +--------------------------------+
#   | MBR (block 0)                  |
#   +--------------------------------+
#   | uboot env (offset 2048, 8 KiB) |
#   +--------------------------------+
#   | Boot A (64 MiB ext2)           |
#   +--------------------------------+
#   | Boot B (64 MiB ext2)           |
#   +--------------------------------+
#   | Rootfs A (384 MiB squashfs)    |
#   +--------------------------------+
#   | Rootfs B (384 MiB squashfs)    |
#   +--------------------------------+
#   | App data (rest, f2fs)          |
#   +--------------------------------+
#
# mbr-a and mbr-b describe the same three subpartition slots pointing at
# different halves, so p1/p2/p3 always address the *active* slot and the
# initramfs never has to know which one is live.

define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

# Boot slots of 64 MiB. These hold the uncompressed aarch64 `Image`, the
# device tree and the initramfs.
#
# The partition is sized generously, but what actually matters is a much
# tighter runtime budget: lk2nd gives the kernel, initramfs and DTB a
# combined 50 MiB of boot memory on this platform (LK2ND_BOOT_MEM_SIZE,
# see lk2nd's Documentation/boot.md). Blowing past that fails the boot
# with no console output. Keep Image + initramfs.gz under ~45 MiB.
#
# Keep BOOT_A_PART_COUNT in sync with the `-b` size passed to genext2fs
# inside scripts/create-boot-img.sh:
#   blocks_512 (here) == 2 * blocks_1024 (genext2fs -b)
define-eval(BOOT_A_PART_OFFSET, "${UBOOT_ENV_OFFSET} + ${UBOOT_ENV_COUNT}")
define(BOOT_A_PART_COUNT, 131072)
define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, 131072)

# 384 MiB rootfs slots. More than this system currently fills — a
# boot-focused Nerves rootfs lands well under 200 MiB — but a graphics
# stack is the obvious next thing to add here and Mesa plus a Skia NIF is
# not small. The slots are cheap: `userdata` on this watch is measured in
# gigabytes.
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 786432)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# App data partition: the rest of `userdata` (it `expand`s at write time).
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 524288)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
