# brcmfmac lacks the port-authorized notification expected by
# wpa_supplicant 2.11/2.12 for firmware-managed WPA authentication.
# Keep WPA in userspace; 0x2000 is BRCMF_FEAT_FWSUP in our pinned kernel.
# Validated on rubyfish: completed authentication and 120/120 ping replies.
options brcmfmac feature_disable=0x2000
